# Source of truth for the values that repeat across run.sh, README.md and CI.
# Edit here, then `python3 kit/render.py`. CI runs `python3 kit/render.py --check`.
# Every scalar is used as the string you typed (0.80 stays 0.80). `null` means none.
# `&name` anchors a value; `*name` reuses it, so a pinned value is written once.

model:
  id: &model nvidia/Qwen3.8-Flash-Next-NVFP4
  revision: &revision fab0aecb760cec45227f6656abcaafa11abca87a
  served_name: &served_name nvidia/Qwen3.8-Flash-Next-NVFP4
  family: Qwen3.8-Flash-Next
  params: ~180B total MoE, 512 experts top-10, 1 MTP layer, native ViT
  quant: MIXED_PRECISION NVFP4 routed experts, FP8 PLE, MTP FP8_BLOCK_SCALES

image:
  base: vllm/vllm-openai:nightly-aarch64
  digest: sha256:df871f170ee7070fbdce162bde08fb616e311570c948a620be0d4b33fe02f87b
  local_tag: &image vllm/vllm-openai:nightly-aarch64@sha256:df871f170ee7070fbdce162bde08fb616e311570c948a620be0d4b33fe02f87b
  build: docker/ple_layer.py overlay (qwen4_exp PLE; nightly already has MIXED_PRECISION FP8)

engine:
  name: vllm
  version: 0.28.1rc1.dev437+ge962733e0

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: &nnodes 2
  tp: &tp 2

serve:
  # The `# BEGIN generated` block of run.sh, in run.sh order. Each key renders as NAME="${NAME:-value}".
  env:
    MODEL: *model
    SERVED_NAME: *served_name
    IMAGE: *image
    CONTAINER_NAME: qwen38-flash-next-nvfp4
    PORT: 8000
    MASTER_PORT: 29523
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1
    TP: *tp
    NNODES: *nnodes
    MAX_MODEL_LEN: 1048576
    MAX_NUM_SEQS: 8
    UTIL: 0.80
    KV_CACHE_DTYPE: auto
    NUM_SPECULATIVE_TOKENS: 3
    SPEC: mtp
    MOE_BACKEND: auto
    MAX_NUM_BATCHED_TOKENS: 8192
    FORCE_UNSAFE_CTX: 0
    FORCE_UNSAFE_MOE: 0
    ENFORCE_EAGER: 0
    VLLM_PLE_FP8_CHECKPOINT: 1
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
    TOOL_CALL_PARSER: qwen3_xml
    REASONING_PARSER: qwen3
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_SHA: *revision
    SKIP_DOWNLOAD: 0
    ORCHESTRATE: auto
    EXTRA_ARGS: ""

readme:
  # Rows of the README "Defaults" table. {NAME} is replaced by serve.env.NAME.
  defaults:
    - Image: "`{IMAGE}`"
    - Model: "`{MODEL}`"
    - "`--tensor-parallel-size` / `--nnodes`": "{TP} / {NNODES}"
    - "`--max-model-len`": "{MAX_MODEL_LEN} (native 262144; 1M is a lab ceiling, not a trained window)"
    - "`--max-num-seqs`": "{MAX_NUM_SEQS}"
    - "`--max-num-batched-tokens`": "{MAX_NUM_BATCHED_TOKENS}"
    - "`--kv-cache-dtype`": "`{KV_CACHE_DTYPE}`"
    - "`--moe-backend`": "`{MOE_BACKEND}` (NVFP4 walks flashinfer then marlin; MTP FP8_BLOCK_SCALES uses triton. `run.sh` refuses `marlin` and `flashinfer_cutlass`)"
    - Checkpoint: "`{SNAPSHOT_SHA}`"
    - Speculative: "MTP-{NUM_SPECULATIVE_TOKENS} (`SPEC={SPEC}`, draft MoE `triton`; NVFP4 experts stay `{MOE_BACKEND}`)"
    - PLE overlay: "`docker/ple_layer.py` (qwen4_exp MIXED_PRECISION FP8) plus `docker/modelopt.py` MTP FP8_BLOCK_SCALES"
    - Oversize window: "`VLLM_ALLOW_LONG_MAX_MODEL_LEN={VLLM_ALLOW_LONG_MAX_MODEL_LEN}` (native 262144; this is not YaRN)"
    - Tokenizers / tools / reasoning: "auto / `{TOOL_CALL_PARSER}` / `{REASONING_PARSER}`"
    - Default thinking: "`enable_thinking=false`"
    - API: "`http://<head>:{PORT}/v1`"
    - Container: "`{CONTAINER_NAME}`"
    - Master port: "{MASTER_PORT}"

measured:
  # The README decode table. One row per (phase, concurrency); a row's three numbers come from one
  # bench_decode.py run. evidence: the file under evidence/ that contains them, or null while there is none.
  decode:
    conditions: streamed greedy, thinking off, 200 completion tokens, 3-run median; max-num-seqs=8, kv auto, context 1048576, MTP-3
    units: {decode: tok/s per stream (median), aggregate: tok/s, ttft_p50: s}
    rows:
      - {phase: prose, concurrency: 1, decode: 38.2, aggregate: 38.2, ttft_p50: 0.17, evidence: evidence/opt-c1-nvidia-modelopt-fab0aec/bench.txt}
      - {phase: prose, concurrency: 2, decode: 36.0, aggregate: 63.1, ttft_p50: 0.16, evidence: evidence/opt-c1-nvidia-modelopt-fab0aec/bench.txt}
      - {phase: structured, concurrency: 1, decode: 67.7, aggregate: 67.7, ttft_p50: 0.15, evidence: evidence/opt-c1-nvidia-modelopt-fab0aec/bench.txt}
      - {phase: structured, concurrency: 2, decode: 49.4, aggregate: 37.4, ttft_p50: 0.16, evidence: evidence/opt-c1-nvidia-modelopt-fab0aec/bench.txt}

links:
  model: https://huggingface.co/nvidia/Qwen3.8-Flash-Next-NVFP4
  base_image: https://hub.docker.com/r/vllm/vllm-openai
  repo: https://github.com/sfxnz/Qwen3.8-Flash-Next-NVFP4-vLLM-2x-DGX-Spark
