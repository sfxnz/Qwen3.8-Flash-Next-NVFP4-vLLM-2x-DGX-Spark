# Source of truth for the values that repeat across run.sh, README.md and CI.
# Edit here, then `python3 kit/render.py`. CI runs `python3 kit/render.py --check`.
# Every scalar is used as the string you typed (0.80 stays 0.80). `null` means none.
# `&name` anchors a value; `*name` reuses it, so a pinned value is written once.

model:
  id: &model nvidia/Qwen3.8-Flash-Next-NVFP4
  revision: &revision fab0aecb760cec45227f6656abcaafa11abca87a
  served_name: &served_name nvidia/Qwen3.8-Flash-Next-NVFP4
  family: Qwen3.8-Flash-Next
  params: ~180B total MoE, 512 experts top-10, 1 MTP layer, native ViT
  quant: MIXED_PRECISION NVFP4 routed experts, FP8 PLE, MTP FP8_BLOCK_SCALES

image:
  base: vllm/vllm-openai:v0.30.0-aarch64
  digest: sha256:4864d46625cbc3307623e29ac742030655e27249feba7b97ec925ce4cc4dfb56
  local_tag: &image vllm/vllm-openai:v0.30.0-aarch64@sha256:4864d46625cbc3307623e29ac742030655e27249feba7b97ec925ce4cc4dfb56
  build: R11 overlays (OVERLAYS_V030) docker/v030/flashinfer_cutlass_moe.py, gdn_attn.py, qsa_indexer.py (S1.5 c=1 determinism), serving.py (vLLM #56067 API CPU)
  # Rollback: IMAGE=<rollback.local_tag> ./run.sh mounts OVERLAYS_PIN (ple_layer.py, modelopt.py, ple_ops.py).
  rollback:
    local_tag: vllm/vllm-openai:nightly-aarch64@sha256:df871f170ee7070fbdce162bde08fb616e311570c948a620be0d4b33fe02f87b
    version: 0.28.1rc1.dev437+ge962733e0

engine:
  name: vllm
  version: 0.30.0

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: &nnodes 2
  tp: &tp 2

serve:
  # The `# BEGIN generated` block of run.sh, in run.sh order. Each key renders as NAME="${NAME:-value}".
  env:
    MODEL: *model
    SERVED_NAME: *served_name
    IMAGE: *image
    CONTAINER_NAME: qwen38-flash-next-nvfp4
    PORT: 8000
    MASTER_PORT: 29523
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1
    TP: *tp
    NNODES: *nnodes
    MAX_MODEL_LEN: 262144
    MAX_NUM_SEQS: 8
    # 0.76 leaves ~4.9 GiB/rank more host headroom than 0.80; 0.80 drove spark1 into a global OOM
    # (evidence/incident-2026-09-29-oom). Plan P2-2.
    UTIL: 0.76
    KV_CACHE_DTYPE: auto
    NUM_SPECULATIVE_TOKENS: 3
    SPEC: mtp
    MOE_BACKEND: auto
    MAX_NUM_BATCHED_TOKENS: 8192
    # Caps each long prompt's prefill chunk so short requests and decoders get scheduled during a
    # 32k-128k prefill (plan P2-5; evidence/u2-v030-default). none = not passed.
    LONG_PREFILL_TOKEN_THRESHOLD: 4800
    # Caps the QSA indexer prefill logits buffer per call (vLLM #56457 GB10 long-prefill hang; F05).
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: 64
    # The serve is the kernel's preferred OOM victim, so host services (sshd, LAIL, Hermes) survive.
    OOM_SCORE_ADJ: 1000
    # Per-node watchdog: docker kill the serve before swap runs out and the host thrashes.
    MEMGUARD: 1
    MEMGUARD_MIN_AVAIL_MB: 2048
    MEMGUARD_MIN_SWAP_FREE_MB: 2048
    FORCE_UNSAFE_CTX: 0
    FORCE_UNSAFE_MOE: 0
    ENFORCE_EAGER: 0
    # DIAGNOSTIC=1 unlocks boots that are never pinned (SPEC=none, known-failing spec configs, missing pin overlays).
    DIAGNOSTIC: 0
    # BENCH_ONLY=1 allows rejection_sample_method=synthetic and binds the API to 127.0.0.1.
    BENCH_ONLY: 0
    VLLM_PLE_FP8_CHECKPOINT: 0
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: 0
    TOOL_CALL_PARSER: qwen3_xml
    REASONING_PARSER: qwen3
    # Checkpoint template plus reasoning_effort aliases high/max -> xhigh, minimal -> low (F21);
    # mounted read-only on the head. none = the checkpoint template.
    CHAT_TEMPLATE: chat_template_alias.jinja
    ASYNC_SCHEDULING: 1
    MM_PROCESSOR_CACHE_GB: 1
    # Image pixel window (both bounds: transformers ignores a lone max_pixels). 4194304 = 2048x2048,
    # ~4k vision tokens. Video frames are capped per frame (cap_pixels_per_frame). Plan P2-3, G07/G12.
    MM_MIN_PIXELS: 65536
    MM_MAX_PIXELS: 4194304
    MM_LIMIT_IMAGE: 8
    MM_LIMIT_VIDEO: 1
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_SHA: *revision
    SKIP_DOWNLOAD: 0
    HF_HUB_DISABLE_XET: 0
    ORCHESTRATE: auto
    # R11 overlays (docker/OVERLAYS.md). auto picks the list for the IMAGE digest; none mounts nothing.
    OVERLAYS: auto
    OVERLAYS_PIN: docker/ple_layer.py docker/modelopt.py docker/ple_ops.py
    OVERLAYS_V030: docker/v030/flashinfer_cutlass_moe.py docker/v030/gdn_attn.py docker/v030/qsa_indexer.py docker/v030/serving.py
    EXTRA_ARGS: ""
    # Space-separated KEY=VALUE pairs passed as `-e` to both ranks.
    EXTRA_ENV: ""

readme:
  # Rows of the README "Defaults" table. {NAME} is replaced by serve.env.NAME.
  defaults:
    - Image: "`{IMAGE}`"
    - Model: "`{MODEL}`"
    - "`--tensor-parallel-size` / `--nnodes`": "{TP} / {NNODES}"
    - "`--max-model-len`": "{MAX_MODEL_LEN} (native window; 1048576 is a lab ceiling, not a trained window)"
    - "`--max-num-seqs`": "{MAX_NUM_SEQS}"
    - "`--max-num-batched-tokens`": "{MAX_NUM_BATCHED_TOKENS}"
    - "`--long-prefill-token-threshold`": "{LONG_PREFILL_TOKEN_THRESHOLD} (a short request during a 128k prefill waits ~5 s instead of ~61 s)"
    - "`--kv-cache-dtype`": "`{KV_CACHE_DTYPE}`"
    - "`--moe-backend`": "`{MOE_BACKEND}` (NVFP4 target resolves to FlashInfer CUTLASS on GB10; the MTP drafter inherits `auto`, which picks Triton for its 64x64-refined FP8 blocks. On the pin `run.sh` refuses anything but `auto`, and `b12x`/`flashinfer_b12x` everywhere)"
    - Checkpoint: "`{SNAPSHOT_SHA}`"
    - Speculative: "MTP-{NUM_SPECULATIVE_TOKENS} (`SPEC={SPEC}`; the drafter's SPEC_CONFIG `moe_backend` is `triton`: v0.30 honours it, the pin's V2 runner ignores it)"
    - Overlays: "`OVERLAYS={OVERLAYS}` → v0.30: `{OVERLAYS_V030}`; pin rollback: `{OVERLAYS_PIN}` (R11 headers, see `docker/OVERLAYS.md`)"
    - v0.30 envs: "`VLLM_PLE_CPU_OFFLOAD=0 VLLM_USE_BREAKABLE_CUDAGRAPH=0` on both ranks when IMAGE is the v0.30 digest (F33: offload pins 32 GiB of host memory per node)"
    - Scheduling: "`--async-scheduling` (`ASYNC_SCHEDULING={ASYNC_SCHEDULING}`); `--per-request-spec-decode-metrics` is not passed (costs ~1 ms/step)"
    - Vision: "`--mm-processor-kwargs` images {MM_MIN_PIXELS}..{MM_MAX_PIXELS} px, video `cap_pixels_per_frame`; `--limit-mm-per-prompt` image {MM_LIMIT_IMAGE} / video {MM_LIMIT_VIDEO}; `--mm-processor-cache-gb {MM_PROCESSOR_CACHE_GB}`"
    - Chat template: "`{CHAT_TEMPLATE}` (checkpoint template + `reasoning_effort` aliases high/max → xhigh, minimal → low; head only)"
    - Indexer logits cap: "`VLLM_SPARSE_INDEXER_MAX_LOGITS_MB={VLLM_SPARSE_INDEXER_MAX_LOGITS_MB}` (vLLM #56457 GB10 long-prefill growth)"
    - Oversize window: "`VLLM_ALLOW_LONG_MAX_MODEL_LEN={VLLM_ALLOW_LONG_MAX_MODEL_LEN}` (required only above 262144; this is not YaRN)"
    - Tokenizers / tools / reasoning: "auto / `{TOOL_CALL_PARSER}` / `{REASONING_PARSER}`"
    - Default thinking: "`enable_thinking=false`"
    - API: "`http://<head>:{PORT}/v1`"
    - Container: "`{CONTAINER_NAME}`"
    - Master port: "{MASTER_PORT}"

measured:
  # The README decode table. One row per (phase, concurrency); a row's three numbers come from one
  # bench_decode.py run. evidence: the file under evidence/ that contains them, or null while there is none.
  decode:
    conditions: streamed greedy, thinking off, max_tokens 200 (prose ≈93 at EOS), 3-run median; max-num-seqs=8, kv auto, context 262144, MTP-3; v0.30.0 + determinism overlays (greedy output and prose acceptance are pinned run to run), recipe defaults at session 3
    units: {decode: tok/s per stream (median), aggregate: tok/s, ttft_p50: s}
    rows:
      - {phase: prose, concurrency: 1, decode: 38.7, aggregate: 38.7, ttft_p50: 0.16, evidence: evidence/u2-v030-default/c-final/gate/bench-frozen.out}
      - {phase: prose, concurrency: 2, decode: 31.9, aggregate: 64.5, ttft_p50: 0.17, evidence: evidence/u2-v030-default/c-final/gate/bench-frozen.out,
         note: "Acceptance is 2.15 at c=2 against 2.37 at c=1, identical in all three session-3 frozen runs: a batch of two computes a different (but reproducible) greedy text than c=1. Compare prose cells only against the same base."}
      - {phase: structured, concurrency: 1, decode: 64.7, aggregate: 64.7, ttft_p50: 0.16, evidence: evidence/u2-v030-default/c-final/gate/bench-frozen.out}
      - {phase: structured, concurrency: 2, decode: 62.9, aggregate: 125.8, ttft_p50: 0.17, evidence: evidence/u2-v030-default/c-final/gate/bench-frozen.out}

links:
  model: https://huggingface.co/nvidia/Qwen3.8-Flash-Next-NVFP4
  base_image: https://hub.docker.com/r/vllm/vllm-openai
  repo: https://github.com/sfxnz/Qwen3.8-Flash-Next-NVFP4-vLLM-2x-DGX-Spark
